<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:'Noto Sans Thai',sans-serif;
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#ecfdf5,#d1fae5);
}

.container{
  max-width:1200px;
  margin:auto;
}

.back-btn{
  padding:8px 16px;
  border:none;
  background:#334155;
  color:white;
  border-radius:20px;
  cursor:pointer;
  margin-bottom:20px;
}

.back-btn:hover{
  background:#1e293b;
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:#065f46;
}

/* ===== Summary Cards ===== */
.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  padding:20px;
  border-radius:15px;
  color:white;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.card.total{ background:linear-gradient(135deg,#10b981,#059669); }
.card.male{ background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
.card.female{ background:linear-gradient(135deg,#ec4899,#be185d); }

.card h2{
  margin:0;
  font-size:16px;
  opacity:0.9;
}

.card h1{
  margin:10px 0 0;
  font-size:28px;
  color:white;
}

/* ===== Chart Section ===== */
.chart-box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:25px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.chart-box h3{
  margin-top:0;
  color:#065f46;
}

canvas{
  max-width:100%;
}
</style>
</head>

<body>

<div class="container">

<button class="back-btn" onclick="goHome()">⬅ กลับไปทำแบบประเมิน</button>

<h1>Dashboard แบบประเมินความพึงพอใจ</h1>

<div class="summary">
  <div class="card total">
    <h2>นักเรียนทั้งหมด</h2>
    <h1 id="total">0</h1>
  </div>

  <div class="card male">
    <h2>นักเรียนชาย</h2>
    <h1 id="maleCount">0</h1>
  </div>

  <div class="card female">
    <h2>นักเรียนหญิง</h2>
    <h1 id="femaleCount">0</h1>
  </div>
</div>

<div class="chart-box">
  <h3>สัดส่วนเพศ</h3>
  <canvas id="genderChart"></canvas>
</div>

<div class="chart-box">
  <h3>จำนวนนักเรียนรายห้อง</h3>
  <canvas id="roomChart"></canvas>
</div>

<div class="chart-box">
  <h3>คะแนนเฉลี่ยแต่ละข้อ</h3>
  <canvas id="scoreChart"></canvas>
</div>

</div>

<script>

function goHome(){
  window.location.href="index.html";
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXudxK37GueTXEWFxJPvsUQsecwrOIbhw3SV_-dk5G0i2PlUYKbF8EmP9C2N7gMwss/exec";

let genderChart, roomChart, scoreChart;

function loadData(){
  const script = document.createElement("script");
  script.src = SCRIPT_URL + "?action=getDashboard&callback=renderDashboard";
  document.body.appendChild(script);
}

function renderDashboard(data){

  document.getElementById("total").innerText = data.total;
  document.getElementById("maleCount").innerText = data.male;
  document.getElementById("femaleCount").innerText = data.female;

  if(genderChart) genderChart.destroy();
  genderChart = new Chart(document.getElementById("genderChart"),{
    type:"doughnut",
    data:{
      labels:["ชาย","หญิง"],
      datasets:[{
        data:[data.male,data.female],
        backgroundColor:["#3b82f6","#ec4899"]
      }]
    }
  });

  if(roomChart) roomChart.destroy();
  roomChart = new Chart(document.getElementById("roomChart"),{
    type:"bar",
    data:{
      labels:Object.keys(data.rooms),
      datasets:[{
        label:"จำนวน",
        data:Object.values(data.rooms),
        backgroundColor:"#10b981"
      }]
    }
  });

  if(scoreChart) scoreChart.destroy();
  scoreChart = new Chart(document.getElementById("scoreChart"),{
    type:"bar",
    data:{
      labels:data.avgScores.map((_,i)=>"ข้อ "+(i+1)),
      datasets:[{
        label:"คะแนนเฉลี่ย",
        data:data.avgScores,
        backgroundColor:[
          "#f59e0b","#10b981","#3b82f6","#ec4899","#8b5cf6"
        ]
      }]
    },
    options:{scales:{y:{min:0,max:5}}}
  });

}

loadData();
setInterval(loadData,60000);

</script>

</body>
</html>
