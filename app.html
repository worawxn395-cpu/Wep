<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบประเมินความพึงพอใจ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  font-family:'Noto Sans Thai',sans-serif;
  margin:0;
  background:#f0fdf4;
}
header{
  background:#16a34a;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}
nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  background:#dcfce7;
  flex-wrap:wrap;
}
nav button{
  padding:8px 16px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:#22c55e;
  color:white;
}
section{
  display:none;
  padding:20px;
  max-width:900px;
  margin:auto;
}
section.active{display:block;}
.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  margin-bottom:20px;
}
input,select,textarea{
  width:100%;
  padding:8px;
  margin-top:5px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
.rating span{
  font-size:24px;
  cursor:pointer;
  margin-right:8px;
  transition:0.2s;
}
.rating span.selected{
  transform:scale(1.3);
  border-bottom:3px solid #16a34a;
}
button.submit{
  background:#16a34a;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
@media(max-width:600px){
  nav{flex-direction:column;}
}
</style>
</head>

<body>

<header>แบบประเมินความพึงพอใจ</header>

<nav>
  <button onclick="showPage('form')">ทำแบบประเมิน</button>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('admin')">จัดการคำถาม</button>
</nav>

<!-- ================= FORM ================= -->
<section id="form" class="active">
<div class="card">
<h3>ข้อมูลทั่วไป</h3>
<input id="name" placeholder="ชื่อ">
<input id="number" placeholder="เลขที่">
<select id="gender">
  <option value="">เลือกเพศ</option>
  <option>ชาย</option>
  <option>หญิง</option>
</select>
<input id="classroom" placeholder="ห้องเรียน">
</div>

<div class="card">
<h3>คำถามประเมิน</h3>
<div id="questions"></div>
</div>

<div class="card">
<h3>ข้อเสนอแนะเพิ่มเติม</h3>
<textarea id="comment"></textarea>
</div>

<button class="submit" onclick="submitForm()">ส่งแบบประเมิน</button>
</section>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard">
<div class="card">
<h3>จำนวนนักเรียนทั้งหมด</h3>
<h1 id="totalCount">0</h1>
<button onclick="loadDashboard()">รีเฟรช</button>
</div>

<div class="card">
<canvas id="genderChart"></canvas>
</div>

<div class="card">
<canvas id="classChart"></canvas>
</div>

<div class="card">
<canvas id="avgChart"></canvas>
</div>
</section>

<!-- ================= ADMIN ================= -->
<section id="admin">
<div class="card">
<h3>แก้ไขคำถาม</h3>
<div id="adminQuestions"></div>
<button onclick="addQuestion()">➕ เพิ่มคำถาม</button>
<button onclick="saveQuestions()">💾 บันทึก</button>
</div>
</section>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwNzBCJ_-hgMBcjCnTinrOxbSgOvtreewRR2zYP6igsPO7AvKctwgsaKmZux36n0ysB/exec";

let questionData=[];
let answers={};

function showPage(page){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");
  if(page==="dashboard") loadDashboard();
}

function loadQuestions(){
  fetch(SCRIPT_URL+"?action=getQuestions")
  .then(r=>r.json())
  .then(data=>{
    questionData=data;
    renderQuestions();
    renderAdmin();
  });
}

function renderQuestions(){
  const container=document.getElementById("questions");
  container.innerHTML="";
  answers={};
  questionData.forEach((q,i)=>{
    const div=document.createElement("div");
    div.innerHTML=`<b>${i+1}. ${q.question}</b>`;
    const rating=document.createElement("div");
    rating.className="rating";
    [5,4,3,2,1].forEach(score=>{
      const span=document.createElement("span");
      span.innerText=q.emoji[score];
      span.onclick=function(){
        document.querySelectorAll(`[data-q='${i}']`).forEach(s=>s.classList.remove("selected"));
        span.classList.add("selected");
        answers[i]=score;
      }
      span.dataset.q=i;
      rating.appendChild(span);
    });
    div.appendChild(rating);
    container.appendChild(div);
  });
}

function submitForm(){
  if(!name.value||!number.value||!gender.value||!classroom.value){
    Swal.fire("กรอกข้อมูลให้ครบ");
    return;
  }
  if(Object.keys(answers).length!==questionData.length){
    Swal.fire("ตอบคำถามให้ครบ");
    return;
  }

  Swal.fire({title:"กำลังบันทึก...",didOpen:()=>Swal.showLoading()});

  const data={
    name:name.value,
    number:number.value,
    gender:gender.value,
    classroom:classroom.value,
    comment:comment.value,
    answers:answers
  };

  const script=document.createElement("script");
  script.src=SCRIPT_URL+"?action=submit&data="+encodeURIComponent(JSON.stringify(data));
  document.body.appendChild(script);

  setTimeout(()=>{
    Swal.fire("สำเร็จแล้ว!");
    document.querySelector("form")?.reset();
  },1500);
}

function loadDashboard(){
  fetch(SCRIPT_URL+"?action=getData")
  .then(r=>r.json())
  .then(data=>{
    totalCount.innerText=data.total;

    new Chart(genderChart,{
      type:'pie',
      data:{
        labels:["ชาย","หญิง"],
        datasets:[{
          data:[data.male,data.female],
          backgroundColor:["#16a34a","#4ade80"]
        }]
      }
    });

    new Chart(classChart,{
      type:'bar',
      data:{
        labels:Object.keys(data.classroom),
        datasets:[{
          data:Object.values(data.classroom),
          backgroundColor:"#22c55e"
        }]
      }
    });

    new Chart(avgChart,{
      type:'bar',
      data:{
        labels:data.avgLabels,
        datasets:[{
          data:data.avgValues,
          backgroundColor:data.avgValues.map(()=>`hsl(${Math.random()*360},70%,60%)`)
        }]
      },
      options:{scales:{y:{min:0,max:5}}}
    });
  });
}

function renderAdmin(){
  const container=document.getElementById("adminQuestions");
  container.innerHTML="";
  questionData.forEach((q,i)=>{
    container.innerHTML+=`
      <div class="card">
      <input value="${q.question}" onchange="questionData[${i}].question=this.value">
      <input value="${q.emoji[5]}" onchange="questionData[${i}].emoji[5]=this.value">
      <input value="${q.emoji[4]}" onchange="questionData[${i}].emoji[4]=this.value">
      <input value="${q.emoji[3]}" onchange="questionData[${i}].emoji[3]=this.value">
      <input value="${q.emoji[2]}" onchange="questionData[${i}].emoji[2]=this.value">
      <input value="${q.emoji[1]}" onchange="questionData[${i}].emoji[1]=this.value">
      <button onclick="questionData.splice(${i},1);renderAdmin();">ลบ</button>
      </div>`;
  });
}

function addQuestion(){
  questionData.push({
    question:"คำถามใหม่",
    emoji:{5:"😍",4:"😊",3:"😐",2:"😕",1:"😢"}
  });
  renderAdmin();
}

function saveQuestions(){
  fetch(SCRIPT_URL+"?action=saveQuestions&data="+encodeURIComponent(JSON.stringify(questionData)))
  .then(()=>Swal.fire("บันทึกแล้ว"));
}

loadQuestions();
setInterval(loadDashboard,60000);
</script>

</body>
</html>
