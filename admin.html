<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin แก้ไขคำถาม</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  font-family:'Noto Sans Thai',sans-serif;
  background:linear-gradient(135deg,#d4f5e9,#b7f0da);
  margin:0;
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

input{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  border:none;
  background:#10b981;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  background:#059669;
}

.question-block{
  border:1px solid #ddd;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  background:#f9fffb;
}
</style>
</head>

<body>

<div class="container">

<h2>จัดการคำถามแบบประเมิน</h2>

<button onclick="goHome()">⬅ กลับไปหน้าแบบประเมิน</button>

<h3>หัวข้อแบบประเมิน</h3>
<input type="text" id="titleInput">

<div id="questionContainer"></div>

<button onclick="addQuestion()">➕ เพิ่มคำถาม</button>
<button onclick="saveAll()">💾 บันทึกทั้งหมด</button>

</div>

<script>

function goHome(){
  window.location.href="index.html";
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygYmC-VC35wmBYr5nJc2J36Z3ps1FiJFfXZ0meSdeMwvpJCKIWu30-PCy5Fkpvrj4U/exec";

let questions=[];

function loadQuestions(){
  const script=document.createElement("script");
  script.src=SCRIPT_URL+"?action=getQuestions&callback=renderQuestions";
  document.body.appendChild(script);
}

function renderQuestions(data){

  // ตั้งหัวข้อ
  document.getElementById("titleInput").value = data.title;

  questions = data.questions;
  displayQuestions();
}

function displayQuestions(){
  const container=document.getElementById("questionContainer");
  container.innerHTML="";

  questions.forEach((q,index)=>{
    container.innerHTML+=`
      <div class="question-block">
        <b>ID: ${q.id}</b>
        <input value="${q.question}" onchange="updateQuestion(${index},this.value)">
        5:<input value="${q.emoji[5]}" onchange="updateEmoji(${index},5,this.value)">
        4:<input value="${q.emoji[4]}" onchange="updateEmoji(${index},4,this.value)">
        3:<input value="${q.emoji[3]}" onchange="updateEmoji(${index},3,this.value)">
        2:<input value="${q.emoji[2]}" onchange="updateEmoji(${index},2,this.value)">
        1:<input value="${q.emoji[1]}" onchange="updateEmoji(${index},1,this.value)">
        <button onclick="deleteQuestion(${index})">ลบ</button>
      </div>
    `;
  });
}

function updateQuestion(i,value){
  questions[i].question=value;
}

function updateEmoji(i,score,value){
  questions[i].emoji[score]=value;
}

function addQuestion(){
  questions.push({
    id: questions.length + 1,
    question:"คำถามใหม่",
    emoji:{5:"😍",4:"😊",3:"😐",2:"😕",1:"😡"}
  });
  displayQuestions();
}

function deleteQuestion(i){
  questions.splice(i,1);
  displayQuestions();
}

function saveAll(){

  const newTitle = document.getElementById("titleInput").value;

  // บันทึกหัวข้อ
  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({title:newTitle})
  });

  // บันทึกคำถาม
  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(questions)
  })
  .then(res=>res.json())
  .then(()=>{
    Swal.fire("บันทึกสำเร็จ","อัปเดตข้อมูลเรียบร้อย","success");
  });

}

loadQuestions();

</script>

</body>
</html>
