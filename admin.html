<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin แก้ไขคำถาม</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:'Noto Sans Thai',sans-serif;
  background:linear-gradient(135deg,#d4f5e9,#b7f0da);
  margin:0;
  padding:20px;
  overflow-x:hidden;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

h2{
  margin-top:0;
  color:#047857;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  padding:10px 14px;
  border:none;
  background:#10b981;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
  font-size:14px;
}

button:hover{
  background:#059669;
}

.top-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.question-block{
  border:1px solid #ddd;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  background:#f9fffb;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.question-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.emoji-grid div{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.emoji-grid label{
  font-size:12px;
  margin-bottom:4px;
  color:#555;
}

@media (max-width:768px){
  body{padding:10px}
  .container{padding:15px}
  .emoji-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media (max-width:480px){
  .emoji-grid{
    grid-template-columns:repeat(2,1fr);
  }
  button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>จัดการคำถามแบบประเมิน</h2>

<div class="top-buttons">
  <button onclick="goHome()">⬅ กลับไปหน้าแบบประเมิน</button>
</div>

<h3>หัวข้อแบบประเมิน</h3>
<input type="text" id="titleInput">

<div id="questionContainer"></div>

<div class="top-buttons">
  <button onclick="addQuestion()">➕ เพิ่มคำถาม</button>
  <button onclick="saveAll()">💾 บันทึกทั้งหมด</button>
</div>

</div>

<script>

function goHome(){
  window.location.href="index.html";
}

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzNqZs-ppxsrhuLH04O85vF-k7vuEpGYsH_WLA_oLnWtH2WHmdYvWxM-Ah1lBoapnSi/exec";

let questions=[];

function loadQuestions(){
  const script=document.createElement("script");
  script.src=SCRIPT_URL+"?action=getQuestions&callback=renderQuestions";
  document.body.appendChild(script);
}

function renderQuestions(data){
  document.getElementById("titleInput").value=data.title;
  questions=data.questions;
  displayQuestions();
}

function displayQuestions(){
  const container=document.getElementById("questionContainer");
  container.innerHTML="";

  questions.forEach((q,index)=>{
    container.innerHTML+=`
      <div class="question-block">

        <div class="question-header">
          <b>ID: ${q.id}</b>
          <button onclick="deleteQuestion(${index})" style="background:#ef4444">ลบ</button>
        </div>

        <input value="${q.question}" 
               onchange="updateQuestion(${index},this.value)">

        <div class="emoji-grid">
          ${[5,4,3,2,1].map(score=>`
            <div>
              <label>คะแนน ${score}</label>
              <input value="${q.emoji[score]}" 
                     onchange="updateEmoji(${index},${score},this.value)">
            </div>
          `).join("")}
        </div>

      </div>
    `;
  });
}

function updateQuestion(i,value){
  questions[i].question=value;
}

function updateEmoji(i,score,value){
  questions[i].emoji[score]=value;
}

function addQuestion(){
  questions.push({
    id:questions.length+1,
    question:"คำถามใหม่",
    emoji:{5:"😍",4:"😊",3:"😐",2:"😕",1:"😡"}
  });
  displayQuestions();
}

function deleteQuestion(i){
  questions.splice(i,1);
  displayQuestions();
}

function saveAll(){

  const newTitle=document.getElementById("titleInput").value;

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({title:newTitle})
  });

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(questions)
  })
  .then(res=>res.json())
  .then(()=>{
    Swal.fire("บันทึกสำเร็จ","อัปเดตข้อมูลเรียบร้อย","success");
  });

}

loadQuestions();

</script>

</body>
</html>
