<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบประเมินความพึงพอใจ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  font-family:'Noto Sans Thai',sans-serif;
  background:linear-gradient(135deg,#d4f5e9,#b7f0da);
  margin:0;
}

/* เมนูด้านบน */
.nav{
  background:#059669;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:15px;
}

.nav button{
  padding:8px 18px;
  border:none;
  border-radius:20px;
  background:white;
  color:#059669;
  font-weight:600;
  cursor:pointer;
}

/* กล่องฟอร์ม */
.container{
  max-width:650px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#047857;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ccc;
}

.question{
  margin-bottom:20px;
  padding:12px;
  background:#f0fdf4;
  border-radius:10px;
  transition:0.3s;
}

/* เส้นเขียวเมื่อเลือกแล้ว */
.question.answered{
  border-bottom:4px solid #10b981;
  padding-bottom:10px;
}

.rating span{
  font-size:28px;
  cursor:pointer;
  margin-right:12px;
  transition:0.2s;
}

.rating span.selected{
  transform:scale(1.3);
  border-bottom:3px solid #10b981;
}

button.submit{
  width:100%;
  padding:12px;
  background:#10b981;
  border:none;
  color:white;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
  <button onclick="go('index.html')">ทำแบบประเมิน</button>
  <button onclick="go('dashboard.html')">Dashboard</button>
  <button onclick="go('admin.html')">Admin</button>
</div>

<div class="container">
<h1>แบบประเมินความพึงพอใจ</h1>

<input type="text" id="name" placeholder="ชื่อ">
<input type="number" id="no" placeholder="เลขที่">

<select id="gender">
<option value="">-- เลือกเพศ --</option>
<option>ชาย</option>
<option>หญิง</option>
</select>

<input type="text" id="room" placeholder="ห้องเรียน">

<div id="questions"></div>

<textarea id="suggestion" placeholder="ข้อเสนอแนะเพิ่มเติม"></textarea>

<button class="submit" onclick="submitForm()">ส่งแบบประเมิน</button>
</div>

<script>

const SCRIPT_URL = "ใส่ลิงก์ Apps Script ของแตง";

function go(page){
  window.location.href = page;
}

let questionData = [];
let answers = {};

function loadQuestions(){
  const script = document.createElement("script");
  script.src = SCRIPT_URL + "?action=getQuestions&callback=renderQuestions";
  document.body.appendChild(script);
}

function renderQuestions(data){
  questionData = data;
  const container = document.getElementById("questions");
  container.innerHTML="";

  data.forEach(q=>{
    const div = document.createElement("div");
    div.className="question";

    div.innerHTML = `
      <label>${q.id}. ${q.question}</label>
      <div class="rating">
        ${[5,4,3,2,1].map(score=>
          `<span data-q="${q.id}" onclick="selectScore(${q.id},${score},this)">
            ${q.emoji[score]}
           </span>`
        ).join("")}
      </div>
    `;
    container.appendChild(div);
  });
}

function selectScore(qid,score,el){

  answers[qid]=score;

  document.querySelectorAll(`[data-q='${qid}']`)
    .forEach(s=>s.classList.remove("selected"));

  el.classList.add("selected");

  el.closest(".question").classList.add("answered");
}

function submitForm(){

  const name = document.getElementById("name").value;
  const no = document.getElementById("no").value;
  const gender = document.getElementById("gender").value;
  const room = document.getElementById("room").value;
  const suggestion = document.getElementById("suggestion").value;

  if(!name || !no || !gender || !room){
    Swal.fire("กรอกข้อมูลให้ครบก่อน");
    return;
  }

  if(Object.keys(answers).length !== questionData.length){
    Swal.fire("กรุณาตอบคำถามให้ครบทุกข้อ");
    return;
  }

  Swal.showLoading();

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      name:name,
      no:no,
      gender:gender,
      room:room,
      answers:Object.values(answers),
      suggestion:suggestion
    })
  })
  .then(res=>res.json())
  .then(()=>{
    Swal.fire("บันทึกสำเร็จ","ขอบคุณสำหรับการประเมิน","success")
    .then(()=>location.reload());
  });

}

loadQuestions();

</script>

</body>
</html>
