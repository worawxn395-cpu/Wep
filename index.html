<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบประเมิน</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:'Noto Sans Thai',sans-serif;
  background:linear-gradient(135deg,#d4f5e9,#b7f0da);
  margin:0;
  overflow-x:hidden;
}

.nav{
  background:#059669;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.nav button{
  padding:8px 18px;
  border:none;
  border-radius:20px;
  background:white;
  color:#059669;
  font-weight:600;
  cursor:pointer;
}

.container{
  max-width:650px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{text-align:center;color:#047857}

input,select,textarea{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

.question{
  margin-bottom:20px;
  padding:12px;
  background:#f0fdf4;
  border-radius:10px;
}

.question.answered{
  border-bottom:4px solid #10b981;
}

.rating{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.rating span{
  font-size:26px;
  cursor:pointer;
  transition:0.2s;
}

.rating span.selected{
  transform:scale(1.3);
  border-bottom:3px solid #10b981;
}

button.submit{
  width:100%;
  padding:12px;
  background:#10b981;
  border:none;
  color:white;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}

@media (max-width:768px){
  .container{margin:15px;padding:18px}
}

@media (max-width:480px){
  .container{margin:10px;padding:15px}
  .nav{flex-direction:column;align-items:center}
  .nav button{width:100%;max-width:250px}
  .rating span{font-size:22px}
}
</style>
</head>

<body>

<div class="nav">
  <button onclick="go('index.html')">ทำแบบประเมิน</button>
  <button onclick="go('dashboard.html')">Dashboard</button>
  <button onclick="go('admin.html')">Admin</button>
</div>

<div class="container">

<h1 id="formTitle">แบบประเมินความพึงพอใจ</h1>

<input type="text" id="name" placeholder="ชื่อ">
<input type="number" id="no" placeholder="เลขที่">
<select id="gender">
<option value="">-- เลือกเพศ --</option>
<option>ชาย</option>
<option>หญิง</option>
</select>
<input type="text" id="room" placeholder="ห้องเรียน">

<div id="questions"></div>

<textarea id="suggestion" placeholder="ข้อเสนอแนะเพิ่มเติม"></textarea>

<button class="submit" onclick="submitForm()">ส่งแบบประเมิน</button>

</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbygYmC-VC35wmBYr5nJc2J36Z3ps1FiJFfXZ0meSdeMwvpJCKIWu30-PCy5Fkpvrj4U/exec";
function go(p){window.location.href=p}
let questionData=[],answers={}

function loadQuestions(){
  const s=document.createElement("script")
  s.src=SCRIPT_URL+"?action=getQuestions&callback=renderQuestions"
  document.body.appendChild(s)
}

function renderQuestions(data){
  document.getElementById("formTitle").innerText=data.title
  questionData=data.questions
  const c=document.getElementById("questions")
  c.innerHTML=""
  questionData.forEach(q=>{
    const d=document.createElement("div")
    d.className="question"
    d.innerHTML=`
      <label>${q.id}. ${q.question}</label>
      <div class="rating">
        ${[5,4,3,2,1].map(s=>
          `<span data-q="${q.id}" onclick="selectScore(${q.id},${s},this)">
            ${q.emoji[s]}
           </span>`
        ).join("")}
      </div>`
    c.appendChild(d)
  })
}

function selectScore(qid,score,el){
  answers[qid]=score
  document.querySelectorAll(`[data-q='${qid}']`).forEach(s=>s.classList.remove("selected"))
  el.classList.add("selected")
  el.closest(".question").classList.add("answered")
}

function submitForm(){
  const name=nameEl.value,
        no=noEl.value,
        gender=genderEl.value,
        room=roomEl.value,
        suggestion=suggestionEl.value
}

const nameEl=document.getElementById("name")
const noEl=document.getElementById("no")
const genderEl=document.getElementById("gender")
const roomEl=document.getElementById("room")
const suggestionEl=document.getElementById("suggestion")

function submitForm(){
  const name=nameEl.value,
        no=noEl.value,
        gender=genderEl.value,
        room=roomEl.value,
        suggestion=suggestionEl.value

  if(!name||!no||!gender||!room){
    Swal.fire("กรอกข้อมูลให้ครบก่อน")
    return
  }

  if(Object.keys(answers).length!==questionData.length){
    Swal.fire("กรุณาตอบคำถามให้ครบทุกข้อ")
    return
  }

  Swal.showLoading()

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      name,no,gender,room,
      answers:Object.values(answers),
      suggestion
    })
  })
  .then(r=>r.json())
  .then(()=>{
    Swal.fire("บันทึกสำเร็จ","ขอบคุณสำหรับการประเมิน","success")
    .then(()=>location.reload())
  })
}

loadQuestions()
</script>

</body>
</html>
